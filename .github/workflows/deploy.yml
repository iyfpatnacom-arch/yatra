name: Deploy to VPS

# The VPS is CPU-starved by its hypervisor (sustained ~60-90% steal), so it
# cannot reliably run `npm ci` or `next build` itself — both time out. The
# build therefore happens here, and the server only ever receives a finished
# standalone bundle and restarts PM2.
#
# Order of the gates — any failure stops the run before production is touched,
# except the last, which puts the previous release back:
#   1. lint                      eslint must be clean
#   2. build                     `next build` must succeed
#   3. smoke test the build      the built server is booted here and
#                                scripts/smoke-test.mjs checks pages, every
#                                CSS/JS chunk they reference, the helplines and
#                                poster from lib/config.js, and the payment
#                                callback route
#   4. deploy                    upload to a staging dir, snapshot the live
#                                release, stop, swap, start
#   5. smoke test production     the same script against https://$DOMAIN
#   6. roll back (on failure)    restore the snapshot and restart

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys interleave on the same target. Queue instead of
# cancelling: a cancelled run could leave a half-rsynced app directory.
concurrency:
  group: deploy-yatra
  cancel-in-progress: false

env:
  APP: yatra
  DOMAIN: yatra.iyfpatna.in
  REMOTE_DIR: /home/iyfpatna-yatra/htdocs/yatra.iyfpatna.in
  OWNER: iyfpatna-yatra

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Node 20 is not arbitrary: the server runs v20.20.2 (module ABI 115).
      # The standalone bundle ships its own node_modules, so a mismatch here
      # would send native binaries the server's Node cannot load.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The lockfiles were authored by npm 11, which records optional native
      # deps (@emnapi/*) differently to the npm 10 bundled with Node 20.
      # Without this, `npm ci` fails with "Missing: @emnapi/core from lock file".
      # Node stays on 20 to match the server's ABI; only npm is upgraded.
      - name: Pin npm to match the lockfile
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time,
      # so they must exist HERE, not just on the server. Without this the
      # build would bake in the dev defaults (localhost, iyfpatna.cloud) and
      # the Razorpay callback URLs would point at a machine that isn't ours.
      # The smoke test reads the same file, so it expects what was baked in.
      - name: Write build-time environment
        run: |
          printf '%s\n' "${{ secrets.BUILD_ENV }}" > .env.production.local
          echo "wrote $(grep -c '^NEXT_PUBLIC_' .env.production.local) NEXT_PUBLIC_ vars"
          if ! grep -q "^NEXT_PUBLIC_SITE_URL=https://$DOMAIN" .env.production.local; then
            echo "BUILD_ENV is missing or has the wrong NEXT_PUBLIC_SITE_URL" >&2
            exit 1
          fi

      # Building on Linux is also what fixes `sharp`: npm resolves the
      # linux-x64 binary here, where a Windows-built bundle carried the
      # win32 one and next/image failed at runtime.
      - name: Build
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          rm -rf .next/standalone/.next/static .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          echo "bundle size: $(du -sh .next/standalone | cut -f1)"

      # Boots the exact bundle that is about to ship, with no MONGODB_URI —
      # public pages must survive the database being unreachable — and runs
      # the smoke test against it. The server is started from a throwaway copy
      # so nothing it writes to its cache ever reaches the upload.
      #
      # Every wait here is bounded: a server that accepts connections but never
      # answers must fail the step in minutes, not sit until the job timeout.
      - name: Smoke test the build
        timeout-minutes: 6
        run: |
          cp -r .next/standalone "$RUNNER_TEMP/smoke"
          MONGODB_URI= PORT=3000 HOSTNAME=127.0.0.1 node "$RUNNER_TEMP/smoke/server.js" \
            < /dev/null > "$RUNNER_TEMP/smoke.log" 2>&1 &
          server=$!
          status=1
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/hi || true)
            echo "waiting for server: HTTP $code"
            [ "$code" = "200" ] && { status=0; break; }
            sleep 2
          done
          if [ "$status" = 0 ]; then
            SMOKE_TIMEOUT_MS=15000 timeout 240 node scripts/smoke-test.mjs http://127.0.0.1:3000 || status=$?
          else
            echo "server never answered /hi with 200" >&2
          fi
          kill $server 2>/dev/null || true
          if [ "$status" != 0 ]; then
            echo "--- server log ---"; tail -n 200 "$RUNNER_TEMP/smoke.log"
            # And the tail of it as an annotation on the run summary.
            echo "::error title=Smoke-test server log::$(tail -n 25 "$RUNNER_TEMP/smoke.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          exit $status

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Key and timeouts in one place, so every ssh and rsync below is plain.
          printf '%s\n' 'Host *' '  IdentityFile ~/.ssh/id_ed25519' \
            '  ConnectTimeout 30' '  ServerAliveInterval 15' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Upload to a staging directory beside the app, never into the live one.
      # Uploading into the live directory while the old process is still
      # running lets it serve (and cache) pages that point at CSS/JS chunks
      # --delete has just removed, and a dropped link mid-rsync would leave
      # production half old, half new.
      - name: Upload bundle
        run: |
          for attempt in 1 2 3 4 5; do
            if rsync -az --delete --partial --timeout=60 \
                 .next/standalone/ \
                 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$REMOTE_DIR.release/"; then
              echo "uploaded on attempt $attempt"; exit 0
            fi
            echo "attempt $attempt failed (the link to this host drops often); retrying"
            sleep 15
          done
          echo "rsync failed after 5 attempts" >&2; exit 1

      # A copy of the release that is live right now, for the rollback step.
      # Everything in it, env file included, is what production is running.
      - name: Snapshot current release
        id: snapshot
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<REMOTE
          set -e
          rsync -a --delete "$REMOTE_DIR/" "$REMOTE_DIR.prev/"
          echo "snapshot taken"
          REMOTE

      - name: Swap in the new release
        id: swap
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<REMOTE
          set -e
          # Stop first, so nothing serves a half-swapped directory, then copy
          # the staged bundle in over local disk (seconds, not minutes).
          # .env.production holds the runtime secrets (Razorpay keys, Mongo
          # URI) and start.sh is written by the server side, so both are kept
          # out of the copy and --delete.
          pm2 stop $APP || true
          rsync -a --delete --exclude='.env.production' --exclude='start.sh' \
            "$REMOTE_DIR.release/" "$REMOTE_DIR/"
          cd "$REMOTE_DIR"
          # Recreate the launcher if it went missing. It sources the env file
          # before exec'ing node, because Next's standalone server reads
          # secrets from process.env at boot.
          if [ ! -x start.sh ]; then
            printf '%s\n' '#!/usr/bin/env bash' 'cd "\$(dirname "\$0")"' \
              'set -a; . ./.env.production; set +a' 'exec /usr/bin/node server.js' > start.sh
            chmod +x start.sh
          fi
          chmod 600 .env.production
          chown -R $OWNER:$OWNER /home/$OWNER/htdocs
          pm2 restart $APP --update-env
          pm2 save
          REMOTE

      # The same checks as against the build, now against the public site
      # through nginx: the new helplines and poster must be what is served,
      # and every chunk the live pages reference must exist.
      - name: Smoke test production
        timeout-minutes: 12
        run: |
          sleep 12
          for attempt in 1 2 3; do
            if node scripts/smoke-test.mjs "https://$DOMAIN"; then
              echo "https://$DOMAIN is live and healthy"; exit 0
            fi
            echo "attempt $attempt failed; giving the server time to warm up"
            sleep 20
          done
          echo "production smoke test failed after deploy" >&2
          exit 1

      # Anything that went wrong after the swap started — a failed restart or
      # a failed production smoke test — puts the previous release back. The
      # run still ends red, so the failure is not missed.
      - name: Roll back to the previous release
        if: failure() && steps.snapshot.outcome == 'success' && (steps.swap.outcome == 'success' || steps.swap.outcome == 'failure')
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<REMOTE
          set -e
          pm2 stop $APP || true
          rsync -a --delete --exclude='.env.production' --exclude='start.sh' \
            "$REMOTE_DIR.prev/" "$REMOTE_DIR/"
          chown -R $OWNER:$OWNER /home/$OWNER/htdocs
          pm2 restart $APP --update-env
          pm2 save
          echo "rolled back to the previous release"
          REMOTE
